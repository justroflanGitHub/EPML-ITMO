# Classification evaluation configuration
metrics:
  - accuracy
  - precision_macro
  - recall_macro
  - f1_macro
  - precision_micro
  - recall_micro
  - f1_micro
cross_validation: true
cv_folds: 5
save_confusion_matrix: true
save_classification_report: true
plot_roc_curve: false  # Only for binary classification
plot_precision_recall_curve: false  # Only for binary classification
