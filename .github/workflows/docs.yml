name: Build and Deploy Documentation

on:
  push:
    branches: [ main, hw_6 ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, hw_6 ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Synchronize Poetry lock file
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking pyproject.toml and poetry.lock..."
          ls -la pyproject.toml poetry.lock
          echo "Regenerating poetry.lock to match pyproject.toml..."
          poetry lock --no-update
          echo "Lock file synchronized at $(date)"

      - name: Install all dependencies
        run: |
          echo "Installing all dependencies and project..."
          poetry install --no-interaction
          echo "All dependencies installed successfully at $(date)"

      - name: Build documentation
        run: |
          cd docs
          poetry run sphinx-build -b html . _build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
