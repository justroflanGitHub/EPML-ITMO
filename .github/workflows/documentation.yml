name: Build and Deploy Documentation

on:
  push:
    branches: [ main, hw_6 ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ main, hw_6 ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install documentation dependencies
        run: |
          echo "Installing documentation dependencies..."
          python -m pip install --upgrade pip
          python -m pip install sphinx myst-parser sphinx-rtd-theme

      - name: Clean Sphinx cache completely
        run: |
          echo "Cleaning ALL Sphinx cache..."
          cd docs
          rm -rf _build
          rm -rf .doctrees
          rm -rf .buildinfo
          rm -rf .env
          echo "Cache cleaned"

      - name: Build documentation
        run: |
          echo "Building Sphinx documentation..."
          cd docs
          # Explicitly disable autosummary generation
          SPHINX_AUTOSUMMARY_GENERATE=False python -m sphinx -b html . _build/html
          echo "Documentation built successfully"
        continue-on-error: true  # Allow build to continue even with warnings

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'  # Only deploy from main branch
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
