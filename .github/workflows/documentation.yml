name: Build and Deploy Documentation

on:
  push:
    branches: [ main, hw_6 ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ main, hw_6 ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install documentation dependencies
        run: |
          echo "Installing documentation dependencies..."
          python -m pip install --upgrade pip
          python -m pip install sphinx myst-parser
          # Install the project in development mode to make src modules available
          python -m pip install -e .

      - name: Clean Sphinx cache completely
        run: |
          echo "Cleaning ALL Sphinx cache..."
          cd docs
          rm -rf _build
          rm -rf .doctrees
          rm -rf .buildinfo
          echo "Cache cleaned"

      - name: Build documentation with fresh environment
        run: |
          echo "Building Sphinx documentation with fresh environment..."
          cd docs
          python -m sphinx -b html --fresh-env . _build/html
          echo "Documentation built successfully"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
